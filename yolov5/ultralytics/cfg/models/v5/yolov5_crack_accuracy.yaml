# ==========================================================================================
# YOLOv5n 裂缝检测「PL 部署版」剪枝结构 —— 【精度优先档】
# 与 yolov5n_crack.yaml（均衡档）的差异: 颈部与检测头整体加宽，检测头 P3:P4:P5 由 32:64:128 → 48:96:192
#   （#10 64→96、#13 64→96、#14 32→48、#17 32→48、#18 48→96、#20 64→96、#21 128→192、#23 128→192）
# 生成时间: 2026-10-08  数据集: RDD_China（3 类: crack / alligator crack / pothole）
# 适用场景: ① 均衡档训完 mAP50 到不了 0.80；② 板子实测有效算力很富裕（≥26 GMAC/s）或可接受 ~15 FPS
# ==========================================================================================
#
# 【实测算力（本工程实测，512×384 输入）】
#   params = 1.218 M   GFLOPs@640 = 4.18   GFLOPs@512x384 = 2.005   GMAC/帧 = 1.003
#   25 FPS 需要有效算力 ≥ 25.1 GMAC/s（换算公式: 所需 GFLOPs@512x384 = 有效 GMAC/s ÷ 25 × 2）
#   → 7020（220 DSP @200MHz 理论 44 GMAC/s，实测有效率一般 20~40%）上多半达不到 25 FPS，
#     仅当实测帧率富余、或愿意把帧率目标降到 ~15 FPS 时使用
#
# 【三档对照（同一骨架，只改通道）】
#   帧率优先 yolov5_crack_speed.yaml   : 0.721 M 参数 / 1.349 GFLOPs / 0.674 GMAC/帧（25FPS 需 ≥16.9 GMAC/s）
#   均衡档   yolov5n_crack.yaml        : 0.757 M 参数 / 1.452 GFLOPs / 0.726 GMAC/帧（25FPS 需 ≥18.2 GMAC/s）
#   精度优先 本文件（头部 = 均衡档骨干 + 加宽颈部/头）: 1.218 M 参数 / 2.005 GFLOPs / 1.003 GMAC/帧（25FPS 需 ≥25.1 GMAC/s）
#
# 【共同约定（三档一致）】
#   1) 激活为 LeakyReLU（PL 白名单，原 SiLU 不可综合）；stem 3×3；SPPF k=3（白名单 MaxPool 只有 3×3/2×2）
#   2) 通道全部为 16 的倍数（本档 Concat 后的 144/96/144/288 同样是 16 的倍数）
#   3) 本 yaml 故意不写 scales:，通道数即最终值（文件名里的字母不触发缩放）
#   4) PL 算到检测头 cv2/cv3 卷积，DFL 的 16-bin softmax 与 cls.sigmoid() 放 PS（白名单外算子）
# ==========================================================================================

nc: 3  # 类别数（RDD_China: 0=crack 1=alligator crack 2=pothole）
activation: nn.LeakyReLU(0.1)  # PL 白名单激活

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]]      # 0-P1/2  16ch
  - [-1, 1, Conv, [32, 3, 2]]      # 1-P2/4  32ch
  - [-1, 1, C3, [32]]              # 2 C3 32ch
  - [-1, 1, Conv, [48, 3, 2]]      # 3-P3/8  48ch（P3 骨干保宽，护细裂缝）
  - [-1, 1, C3, [48]]              # 4 C3 48ch
  - [-1, 1, Conv, [48, 3, 2]]      # 5-P4/16 48ch
  - [-1, 2, C3, [48]]              # 6 C3 48ch x2
  - [-1, 1, Conv, [96, 3, 2]]      # 7-P5/32 96ch
  - [-1, 1, C3, [96]]              # 8 C3 96ch
  - [-1, 1, SPPF, [96, 3]]         # 9 SPPF 96ch（k=3）

head:
  - [-1, 1, Conv, [96, 1, 1]]                          # 10 颈部 P5→P4 96ch（均衡档为 64）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 11
  - [[-1, 6], 1, Concat, [1]]                          # 12 cat 骨干 P4 → 96+48=144
  - [-1, 1, C3, [96, False]]                           # 13 颈部 P4 96ch（均衡档为 64）
  - [-1, 1, Conv, [48, 1, 1]]                          # 14 P4→P3 48ch（均衡档为 32）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 15
  - [[-1, 4], 1, Concat, [1]]                          # 16 cat 骨干 P3 → 48+48=96
  - [-1, 1, C3, [48, False]]                           # 17 检测头 P3/8-small  48ch（均衡档为 32）
  - [-1, 1, Conv, [96, 3, 2]]                          # 18 P3→P4 96ch（均衡档为 48）
  - [[-1, 14], 1, Concat, [1]]                         # 19 cat 头 P4 → 96+48=144
  - [-1, 1, C3, [96, False]]                           # 20 检测头 P4/16-medium 96ch（均衡档为 64）
  - [-1, 1, Conv, [192, 3, 2]]                         # 21 P4→P5 192ch（均衡档为 128）
  - [[-1, 10], 1, Concat, [1]]                         # 22 cat 头 P5 → 192+96=288
  - [-1, 1, C3, [192, False]]                          # 23 检测头 P5/32-large  192ch（均衡档为 128）

  - [[17, 20, 23], 1, Detect, [nc]]  # Detect(P3, P4, P5) = 48:96:192
