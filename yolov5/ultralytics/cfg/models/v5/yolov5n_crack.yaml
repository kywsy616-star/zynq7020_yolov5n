# Ultralytics YOLO 🚀, AGPL-3.0 license
# ==========================================================================================
# YOLOv5n 裂缝检测「PL 部署版」剪枝结构（面向 Xilinx XC7Z020 + 自研 HLS 加速器）
# 生成时间: 2026-10-08  数据集: RDD_China（3 类: crack / alligator crack / pothole）
# 目标约束: 模型输入 512×384（4:3，与 RDD_China 裁剪图原生尺寸一致，无灰边）
#           目标帧率 25 FPS，目标精度 mAP50 ≥ 0.80（同场景 val/test 口径）
# ==========================================================================================
#
# 【一、结构设计依据（实测，非估算）】
#   params = 0.757 M   GFLOPs@640 = 3.03   GFLOPs@512x384 = 1.452   GMAC/帧 = 0.726
#   7020 参考: 220 DSP48E1 @200MHz → 理论峰值 44 GMAC/s；YOLO 类 HLS 加速器实测有效率一般 20~40%
#              → 有效 9~18 GMAC/s；25 FPS 需要 GMAC/帧 ≤ 0.36(9GMAC/s) ~ 0.72(18GMAC/s)
#   换算公式: 所需 GFLOPs@512x384 = (实测有效 GMAC/s ÷ 25) × 2
#   本结构 0.726 GMAC/帧 → 25 FPS 需 ≥18.2 GMAC/s（属"高利用率"档，上板实测后再微调）
#
# 【二、相对官方 yolov5.yaml 的改动】
#   1) 激活: 官方 SiLU(x·sigmoid(x)) 不在 PL 白名单 → 用 activation 键全局换成 LeakyReLU(0.1)
#      （parse_model 会执行 Conv.default_act = eval(act)；换激活不涉及权重，仍可用 yolov5n.pt 初始化）
#   2) stem #0: 6×6 s2 → 3×3 s2（白名单只有 3×3；实测省约 4% 算力）
#   3) SPPF #9: k=5 → k=3（白名单 MaxPool 只支持 3×3/2×2；三级 3×3 级联等效感受野 7×7）
#   4) 通道: 浅层 16/32/32；**P3 骨干保 48（细长裂缝靠浅层+P3，刻意保宽）**；颈部/深层收到 48/96/96/96
#            检测头 32:64:128（P3:P4:P5 = 1:2:4，全部 16 对齐，避免 PE 空转与 DMA 拆包）
#   5) 深度保持 v5n 级（C3 n=1,1,2,3,1）：减深度比减宽度更伤特征表达，本次不动深度
#
# 【三、通道对齐说明】全部通道为 8/16 的整数倍：16/32/48/64/96/128/192（含 Concat 后的中间量
#   48+48=96、32+48=80、64+32=96、128+64=192 亦为 16 的倍数）。
#
# 【四、PL / PS 分工（重要）】
#   PL: 骨干 + 颈部 + 检测头的 cv2/cv3 卷积（均为 Conv 1x1/3x3，全部在白名单内），
#       输出 3 个尺度的原始张量（通道数 = 4*16 + nc = 67）
#   PS: DFL 的 16-bin softmax、cls.sigmoid()、bbox decode、NMS
#       —— 这两处 sigmoid/softmax 是 Detect._inference() 里的函数式算子（非 nn.Module），
#          放在 ARM A9 上做，PL 侧零改结构、零精度损失；25 FPS=40ms/帧，请单独实测 PS 端耗时
#   量化: 训练后把 BatchNorm 融合进卷积（Conv+BN+LeakyReLU 三合一），INT8 定点部署
#
# 【五、三档备选（按实测帧率二选一，只改对应行）】
#   A. 帧率优先（本文件的默认值再收浅层）: #3/#4 由 48 改 32 → GMAC/帧 0.674（25FPS 需 16.9 GMAC/s）
#   B. 本文件默认（均衡，推荐起点）        : GMAC/帧 0.726（25FPS 需 18.2 GMAC/s）
#   C. 精度优先（若 mAP50 不达 0.80 再上）: 见 yolov5_crack_accuracy.yaml —— 头改 48:96:192 且同层颈部同步
#      （#10=96, #13=96, #14=48, #17=48, #18=96, #20=96, #21=192, #23=192）
#      → 实测 1.218 M 参数 / 2.005 GFLOPs@512×384，GMAC/帧 1.003（25FPS 需 25.1 GMAC/s，7020 上多半达不到，
#        仅当帧率富余或可接受 ~15 FPS 时用）
#   （三档已做成脚本里的档位开关: train_crack_4_3.py 的 PROFILE = "speed" / "balance" / "accuracy"）
#
# 【六、注意】本 yaml **故意不写 scales:**，通道数即最终值。
#   文件名 yolov5n_crack.yaml 里的 "n" 只表示"v5n 规模"，不会触发缩放（无 scales 块时
#   parse_model 不做任何 width/depth 缩放）；请勿补上 scales: 块，否则通道会被再乘一遍 width。
# ==========================================================================================

nc: 3  # 类别数（RDD_China: 0=crack 1=alligator crack 2=pothole）
activation: nn.LeakyReLU(0.1)  # PL 白名单激活；若连 LeakyReLU 都省，可改 nn.ReLU()（精度会再掉一点）

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]]      # 0-P1/2  16ch（stem 6x6→3x3）
  - [-1, 1, Conv, [32, 3, 2]]      # 1-P2/4  32ch
  - [-1, 1, C3, [32]]              # 2 C3 32ch
  - [-1, 1, Conv, [48, 3, 2]]      # 3-P3/8  48ch（P3 骨干保宽，护细裂缝）
  - [-1, 1, C3, [48]]              # 4 C3 48ch ← 供颈部 Concat（P3 浅层特征）
  - [-1, 1, Conv, [48, 3, 2]]      # 5-P4/16 48ch
  - [-1, 2, C3, [48]]              # 6 C3 48ch x2
  - [-1, 1, Conv, [96, 3, 2]]      # 7-P5/32 96ch
  - [-1, 1, C3, [96]]              # 8 C3 96ch
  - [-1, 1, SPPF, [96, 3]]         # 9 SPPF 96ch（k=3，白名单 3x3 MaxPool）

head:
  - [-1, 1, Conv, [64, 1, 1]]                          # 10 颈部 P5→P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 11 最近邻上采样（白名单）
  - [[-1, 6], 1, Concat, [1]]                          # 12 cat 骨干 P4 → 64+48=112
  - [-1, 1, C3, [64, False]]                           # 13 颈部 P4 64ch
  - [-1, 1, Conv, [32, 1, 1]]                          # 14 P4→P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 15
  - [[-1, 4], 1, Concat, [1]]                          # 16 cat 骨干 P3 → 32+48=80
  - [-1, 1, C3, [32, False]]                           # 17 检测头 P3/8-small  32ch（细裂缝主战场）
  - [-1, 1, Conv, [64, 3, 2]]                          # 18 P3→P4
  - [[-1, 14], 1, Concat, [1]]                         # 19 cat 头 P4 → 64+32=96
  - [-1, 1, C3, [64, False]]                           # 20 检测头 P4/16-medium 64ch
  - [-1, 1, Conv, [128, 3, 2]]                         # 21 P4→P5
  - [[-1, 10], 1, Concat, [1]]                         # 22 cat 头 P5 → 128+64=192
  - [-1, 1, C3, [128, False]]                          # 23 检测头 P5/32-large  128ch

  - [[17, 20, 23], 1, Detect, [nc]]  # Detect(P3, P4, P5)
