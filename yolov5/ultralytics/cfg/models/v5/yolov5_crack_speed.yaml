# ==========================================================================================
# YOLOv5n 裂缝检测「PL 部署版」剪枝结构 —— 【帧率优先档】
# 与 yolov5n_crack.yaml（均衡档）的唯一差异: 骨干 P3 的 #3/#4 由 48 收到 32
# 生成时间: 2026-10-08  数据集: RDD_China（3 类: crack / alligator crack / pothole）
# 适用场景: 板子（XC7Z020 + HLS）实测有效算力偏低（约 15~17 GMAC/s）时优先保 25 FPS
# ==========================================================================================
#
# 【实测算力（本工程实测，512×384 输入）】
#   params = 0.721 M   GFLOPs@640 = 2.81   GFLOPs@512x384 = 1.349   GMAC/帧 = 0.674
#   25 FPS 需要有效算力 ≥ 16.9 GMAC/s（换算公式: 所需 GFLOPs@512x384 = 有效 GMAC/s ÷ 25 × 2）
#   与均衡档对比: 1.452 → 1.349 GFLOPs（-7%），P3 骨干 48 → 32
#
# 【与均衡档的取舍】
#   帧率优先: 省 ~7% 算力，但 P3 骨干（细长裂缝主要依赖的浅层通道）变窄 → crack 类 AP 可能下降
#   均衡档  : 已写入 yolov5n_crack.yaml，实测 1.452 GFLOPs / 0.726 GMAC/帧
#   精度优先: 见 yolov5_crack_accuracy.yaml，头 48:96:192，2.005 GFLOPs / 1.003 GMAC/帧（25FPS 需 ≥25.1 GMAC/s）
#
# 【共同约定（三档一致）】
#   1) 激活为 LeakyReLU（PL 白名单，原 SiLU 不可综合）；stem 3×3；SPPF k=3（白名单 MaxPool 只有 3×3/2×2）
#   2) 通道全部为 16 的倍数，避免 PE 空转与 AXI 突发拆包
#   3) 本 yaml 故意不写 scales:，通道数即最终值（文件名里的字母不触发缩放）
#   4) PL 算到检测头 cv2/cv3 卷积，DFL 的 16-bin softmax 与 cls.sigmoid() 放 PS（白名单外算子）
# ==========================================================================================

nc: 3  # 类别数（RDD_China: 0=crack 1=alligator crack 2=pothole）
activation: nn.LeakyReLU(0.1)  # PL 白名单激活

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]]      # 0-P1/2  16ch
  - [-1, 1, Conv, [32, 3, 2]]      # 1-P2/4  32ch
  - [-1, 1, C3, [32]]              # 2 C3 32ch
  - [-1, 1, Conv, [32, 3, 2]]      # 3-P3/8  32ch ← 本档由 48 收到 32（省算力、P3 变窄）
  - [-1, 1, C3, [32]]              # 4 C3 32ch ← 供颈部 Concat
  - [-1, 1, Conv, [48, 3, 2]]      # 5-P4/16 48ch
  - [-1, 2, C3, [48]]              # 6 C3 48ch x2
  - [-1, 1, Conv, [96, 3, 2]]      # 7-P5/32 96ch
  - [-1, 1, C3, [96]]              # 8 C3 96ch
  - [-1, 1, SPPF, [96, 3]]         # 9 SPPF 96ch（k=3）

head:
  - [-1, 1, Conv, [48, 1, 1]]                          # 10 颈部 P5→P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 11
  - [[-1, 6], 1, Concat, [1]]                          # 12 cat 骨干 P4 → 48+48=96
  - [-1, 1, C3, [48, False]]                           # 13 颈部 P4 48ch
  - [-1, 1, Conv, [32, 1, 1]]                          # 14 P4→P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 15
  - [[-1, 4], 1, Concat, [1]]                          # 16 cat 骨干 P3 → 32+32=64
  - [-1, 1, C3, [32, False]]                           # 17 检测头 P3/8-small  32ch
  - [-1, 1, Conv, [48, 3, 2]]                          # 18 P3→P4
  - [[-1, 14], 1, Concat, [1]]                         # 19 cat 头 P4 → 48+32=80
  - [-1, 1, C3, [64, False]]                           # 20 检测头 P4/16-medium 64ch
  - [-1, 1, Conv, [128, 3, 2]]                         # 21 P4→P5
  - [[-1, 10], 1, Concat, [1]]                         # 22 cat 头 P5 → 128+48=176
  - [-1, 1, C3, [128, False]]                          # 23 检测头 P5/32-large  128ch

  - [[17, 20, 23], 1, Detect, [nc]]  # Detect(P3, P4, P5) = 32:64:128
